name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Callable so `release.yml` gates a tagged release on this exact matrix
  # instead of maintaining a second copy of it.
  workflow_call:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python (>=3.10) and the classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # v5/v6 are the majors that moved these off Node 20, which the runners now
      # force onto Node 24 with a deprecation annotation. Pinned to the current
      # major rather than a SHA: this workflow builds nothing and publishes
      # nothing, so the supply-chain case for SHA pinning is weaker than the cost
      # of hand-updating them.
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Base includes the ML stack — torch and friends are core dependencies, not
      # extras — so this step installs them and dominates the job. The suite
      # doesn't need them (see tests/test_lazy_ml_imports.py); installing them
      # anyway keeps this one honest line instead of a second copy of the
      # dependency list.
      #
      # `mcp` is here because tests/test_mcp_serve.py importorskips it: without
      # the extra those tests skip and the MCP server has no CI coverage at all.
      # Cheap, unlike the ML stack — pure-Python wheels, and it supports every
      # version in the matrix.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,mcp]'

      - name: Run tests
        run: |
          python -m ruff check .
          python -m pytest -q

  package:
    # Editable installs can hide missing package-data declarations. Build and
    # install the actual wheel on every PR so a tagged release is not its first
    # clean-artifact test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/researchwiki-wheel-smoke
          /tmp/researchwiki-wheel-smoke/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/researchwiki-wheel-smoke/bin/researchwiki --version
          /tmp/researchwiki-wheel-smoke/bin/python - <<'PY'
          import importlib.resources as resources

          package = resources.files("researchwiki")
          assert package.joinpath("templates/graph.html").is_file()
          assert any(package.joinpath("pdf/data").iterdir())
          PY

  windows-concurrency:
    # The shared-write path used to fall back to no locking when `fcntl` was
    # absent. Keep the Windows guarantee executable without paying for the
    # multi-gigabyte ML stack a second time.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install pytest filelock pyyaml

      - name: Exercise cross-platform writes and provider boundaries
        run: python -m pytest -q tests/test_fsatomic.py tests/test_provider_cache.py tests/test_provider_http.py
