name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Callable so `release.yml` gates a tagged release on this exact matrix
  # instead of maintaining a second copy of it.
  workflow_call:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python (>=3.10) and the classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # v5/v6 are the majors that moved these off Node 20, which the runners now
      # force onto Node 24 with a deprecation annotation. Pinned to the current
      # major rather than a SHA: this workflow builds nothing and publishes
      # nothing, so the supply-chain case for SHA pinning is weaker than the cost
      # of hand-updating them.
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # `.[dev]` is base + pytest. NOTE: base is not light — torch,
      # transformers, sentence-transformers and anthropic are *core* dependencies
      # in pyproject.toml, not extras, so every matrix leg installs the whole ML
      # stack. This step dominates the job; the tests themselves are a fraction
      # of it. (An earlier version of this comment claimed a `semantic` and an
      # `anthropic` extra kept them out of CI. Those extras have never existed.)
      #
      # The suite needs none of them — it is hermetic, and passes with only
      # pypdfium2 / tantivy / pyyaml / numpy / pytest installed. Moving the heavy
      # dependencies behind a real extra would shrink this step to almost
      # nothing, but it changes what a default `pip install researchwiki` gives a
      # user, so it's a deliberate call rather than a CI-only edit.
      #
      # To re-check either claim rather than trusting this comment:
      #   install/test split → `gh run view --log <run-id>` step timings
      #   what the suite needs → run it in a venv holding just the five above
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest -q
