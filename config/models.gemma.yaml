# Gemma 4 31B via Google's Gemini OpenAI-compatible endpoint.
#
# Uses the `openai-compatible` provider — same endpoint/key as
# models.gemini.yaml, different model. Endpoint folded into `base_url:` below;
# .env needs only:
#   OPENAI_API_KEY=AIza...        # Gemini API key, forwarded as Bearer
#
# Tried as a workaround for gemini-3.5-flash's tight free-tier ceiling
# (~5-20 req/min, see models.gemini.yaml) — gemma-4-31b-it sits on a
# separate quota bucket and did not 429 in testing. Confirm model
# availability for your key with:
#   curl -s -H "Authorization: Bearer $OPENAI_API_KEY" \
#     https://generativelanguage.googleapis.com/v1beta/openai/models | grep gemma
#
# Two behavioral differences from the Gemini Flash family, both handled:
#   1. Does NOT support `reasoning_effort` — the endpoint 400s
#      ("Thinking level is not supported for this model") rather than
#      silently ignoring it, so the field is omitted below entirely.
#   2. Still thinks by default, but inlines the chain-of-thought as a
#      literal `<thought>...</thought>` prefix in `message.content`
#      instead of a separate field — llm.py's call_openai_compatible()
#      strips a leading <thought>...</thought> block before returning,
#      so downstream phases only see the actual answer. Thinking still
#      consumes max_tokens budget, so tokens below are sized generously.
#
# One model for every role (like models.glm.yaml) — Gemma-4 doesn't ship
# a matching smart/cheap pair the way Gemini Flash/Flash-Lite does.
#
# rpm: 15 on every role — gemma-4-31b-it's free-tier RPM ceiling (see
# llm._throttle). Keyed by model, so all six roles share one 15 RPM budget and
# calls pace evenly instead of bursting into 429s. Raise/remove on a paid tier.
#
# ingest.n_drafts: default author-draft count when `-n` is omitted. 1 keeps
# author calls low on the free tier; CLI `-n` still overrides.

base_url: https://generativelanguage.googleapis.com/v1beta/openai/

ingest:
  n_drafts: 1

roles:
  author:
    provider: openai-compatible
    model: gemma-4-31b-it
    temperature: 0.5
    max_tokens: 6000
    rpm: 15

  critic:
    provider: openai-compatible
    model: gemma-4-31b-it
    temperature: 0.3
    max_tokens: 2500
    rpm: 15

  judge:
    provider: openai-compatible
    model: gemma-4-31b-it
    temperature: 0.2
    max_tokens: 1500
    rpm: 15

  classifier:
    provider: openai-compatible
    model: gemma-4-31b-it
    temperature: 0.1
    max_tokens: 500
    rpm: 15

  proposer:
    provider: openai-compatible
    model: gemma-4-31b-it
    temperature: 0.3
    max_tokens: 500
    rpm: 15

  extractor:
    provider: openai-compatible
    model: gemma-4-31b-it
    temperature: 0.0
    max_tokens: 1200
    rpm: 15
