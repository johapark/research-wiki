# API pricing, USD per million tokens. Read by the Pricing section of
# `researchwiki/agents/model_config.py` — the module that already owns per-phase
# model routing, so one place holds every fact about a model. Consumed by
# `researchwiki status` (7-day cost rollup) and `researchwiki insights` (per-model
# spend). Data only — no code change needed to correct a rate.
#
# Rates rot. `as_of` is the date the numbers below were last checked against the
# sources, and every surface that prints a dollar figure prints that date beside
# it, so a stale table is visible rather than silently wrong.
#
# ---------------------------------------------------------------------------
# TO REFRESH
#   1. Open both `sources:` URLs below.
#   2. Correct any changed rate. Add new models; do NOT delete retired ones —
#      old `ingest_iterations` rows still reference them and would silently
#      re-price to $0.00.
#   3. Bump `as_of` in the SAME edit. A rate change without a date bump is
#      indistinguishable from a table nobody has checked.
#   4. `python3 -m pytest tests/test_pricing.py`
# ---------------------------------------------------------------------------
#
# WHAT THIS ESTIMATE MODELS:
#   * New ingest rows record cache-read/write tokens. Anthropic's 5-minute
#     write and read multipliers below are applied to those buckets. Legacy rows
#     remain unadjusted because their cache split is unknowable.
#
# WHAT THIS ESTIMATE IGNORES:
#   * Batch API (50% off both directions). Nothing here uses it today.
#   * Long-context surcharges, fast mode, and data-residency multipliers.
#   * Server-side tools (e.g. web search at $10/1,000 searches).
#
# Local models (LM Studio, Ollama, gemma-*, qwen-*) have no per-token price and
# are deliberately absent — `model_config.rate_for()` returns None for an unknown
# model and callers render $0.00, which is correct for a model running on your own
# machine. `model_config.unpriced_models()` is what tells that apart from a cloud
# model that is merely missing from this table.

as_of: "2026-08-03"

sources:
  anthropic: "https://platform.claude.com/docs/en/about-claude/pricing"
  openai: "https://developers.openai.com/api/docs/pricing"

# Multipliers relative to base input. The 5-minute write and read rates are
# applied when an Anthropic response reports those token buckets.
modifiers:
  anthropic:
    cache_write_5m: 1.25
    cache_write_1h: 2.0
    cache_read: 0.1
    batch: 0.5

models:
  # ---- Anthropic ----------------------------------------------------------
  # Keys are model-ID prefixes. A dated ID like
  # `claude-haiku-4-5-20251001` resolves to `claude-haiku-4-5` — longest prefix
  # wins, see `model_config.rate_for()`.
  claude-fable-5:      {in: 10.0, out: 50.0, provider: anthropic}
  claude-mythos-5:     {in: 10.0, out: 50.0, provider: anthropic}
  claude-opus-5:       {in: 5.0,  out: 25.0, provider: anthropic}
  claude-opus-4-8:     {in: 5.0,  out: 25.0, provider: anthropic}
  claude-opus-4-7:     {in: 5.0,  out: 25.0, provider: anthropic}
  claude-opus-4-6:     {in: 5.0,  out: 25.0, provider: anthropic}
  claude-opus-4-5:     {in: 5.0,  out: 25.0, provider: anthropic}
  claude-opus-4-1:     {in: 15.0, out: 75.0, provider: anthropic}   # deprecated
  claude-opus-4:       {in: 15.0, out: 75.0, provider: anthropic}   # retired
  # Sonnet 5 is on introductory pricing that EXPIRES. `until` is inclusive; once
  # today is past it, `model_config.rate_for()` falls through to the entry with no
  # `until`.
  # This is the one rate in the table that changes on a calendar date rather
  # than on a vendor announcement.
  claude-sonnet-5:
    - {in: 2.0, out: 10.0, provider: anthropic, until: "2026-08-31",
       note: "introductory pricing"}
    - {in: 3.0, out: 15.0, provider: anthropic,
       note: "standard, from 2026-09-01"}
  claude-sonnet-4-6:   {in: 3.0,  out: 15.0, provider: anthropic}
  claude-sonnet-4-5:   {in: 3.0,  out: 15.0, provider: anthropic}
  claude-sonnet-4:     {in: 3.0,  out: 15.0, provider: anthropic}   # retired
  claude-haiku-4-5:    {in: 1.0,  out: 5.0,  provider: anthropic}
  claude-haiku-3-5:    {in: 0.8,  out: 4.0,  provider: anthropic}   # retired

  # ---- OpenAI -------------------------------------------------------------
  # Short-context standard rates. Long-context tiers cost more and aren't
  # modelled; see the source URL.
