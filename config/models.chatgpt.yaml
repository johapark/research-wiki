# OpenAI ChatGPT — https://api.openai.com/v1
# Endpoint folded into `base_url:` below, so .env needs only the key:
#   OPENAI_API_KEY=sk-...
# (RW_LLM_BASE_URL in .env still overrides base_url if set.)
#
# Select this config with RW_MODELS_CONFIG=models.chatgpt.yaml.
# gpt-6-sol drives the quality-sensitive roles (author/critic/judge);
# every other role runs on gpt-6-luna.
# Sol uses explicit reasoning effort; completion caps include both reasoning
# and visible output. Temperatures apply only with reasoning_effort: none.
#
# gpt-5.4-mini is deliberately absent. It used to hold classifier/extractor as
# "the cheap one", which it is not: per config/pricing.yaml mini is $0.75/$4.50
# per Mtok against gpt-6-luna's $0.10/$0.50. There was no quality argument
# for mini either, so it is gone rather than merely demoted.
#
# Historical measured cost under the prior terra/luna routing
# (upper bounds — prompt-cache hits not subtracted):
#   author/critic/judge on luna   ~$0.009/paper  (n=13)
#   author/critic/judge on terra  ~$0.071/paper  (n=4)
# Terra is 10x luna's rate on both input and output; normalized for paper size
# the same ingests run ~9x dearer. Spend concentrates in two phases: `author`
# and `target_claims` (46K and 32K input tokens respectively across 4 papers).

base_url: https://api.openai.com/v1

roles:
  # Drafting — produces the page prose. Quality matters most here.
  author:
    provider: openai-compatible
    model: gpt-6-sol
    reasoning_effort: medium
    temperature: 0.5
    max_tokens: 12000

  # Critic — turns grader flags into revision notes.
  critic:
    provider: openai-compatible
    model: gpt-6-sol
    reasoning_effort: low
    temperature: 0.3
    max_tokens: 6000

  # Judge — structural decisions (cross-link selection, memory evolution).
  judge:
    provider: openai-compatible
    model: gpt-6-sol
    reasoning_effort: low
    temperature: 0.2
    max_tokens: 6000

  # Classifier — single JSON verdict, deterministic.
  classifier:
    provider: openai-compatible
    model: gpt-6-luna
    reasoning_effort: none
    temperature: 0.1
    max_tokens: 200

  # Proposer — short-name / keyword lists.
  proposer:
    provider: openai-compatible
    model: gpt-6-luna
    reasoning_effort: none
    temperature: 0.3
    max_tokens: 200

  # Extractor — narrow title/authors/DOI/abstract fields from the PDF's first page.
  extractor:
    provider: openai-compatible
    model: gpt-6-luna
    reasoning_effort: none
    temperature: 0.0
    max_tokens: 800

phases:
  author:           {role: author}
  evolve:           {role: author}
  debug:            {role: author, temperature: 0.2}
  critic:           {role: critic}
  classifier:       {role: classifier}
  short_name:       {role: proposer, max_tokens: 220}
  keywords:         {role: proposer}
  link_generation:  {role: judge, max_tokens: 4000}
  memory_evolution: {role: judge, max_tokens: 6000}
  synthesis_judge:  {role: judge}
  eval_judge:       {role: judge}
  # Override the built-in 400-token caps, which are too tight for reasoning.
  cross_paper_judge: {role: judge, temperature: 0.0, max_tokens: 4000}
  claim_overlap_judge: {role: judge, temperature: 0.0, max_tokens: 4000}
  proposal_generation: {role: author, temperature: 0.6, max_tokens: 12000}
  reconcile:        {role: extractor}
  # Paper-wide coverage extraction is quality-sensitive: use the Sol judge
  # while keeping routine first-page metadata extraction on Luna. The cap
  # reserves space for low-effort reasoning as well as the claims list.
  target_claims:    {role: judge, temperature: 0.0, max_tokens: 8000}
  claim_support:    {role: judge}
