# OpenAI ChatGPT — https://api.openai.com/v1
# Endpoint folded into `base_url:` below, so .env needs only the key:
#   OPENAI_API_KEY=sk-...
# (RW_LLM_BASE_URL in .env still overrides base_url if set.)
#
# Select this config with RW_MODELS_CONFIG=models.chatgpt.yaml.
# gpt-5.6-terra drives the quality-sensitive roles (author/critic/judge);
# the deterministic short-output roles (classifier, extractor) run on
# gpt-5.4-mini; proposer on gpt-5.6-luna.
#
# NOTE: mini is NOT the cheap option here, despite the name. Per
# config/pricing.yaml it is $0.75/$4.50 per Mtok against luna's $0.20/$1.20 —
# 3.75x dearer on both, because it belongs to the older 5.4 generation and the
# 5.6 line cut prices. Routing classifier/extractor to mini is a cost increase
# over luna, not a saving. It costs little today only because those phases
# barely consume tokens (measured: 0 across a 4-paper batch, since reconcile
# resolves from S2/Crossref without an LLM call). If they ever do, move them
# to luna.
#
# Measured cost, this corpus (upper bounds — prompt-cache hits not subtracted):
#   author/critic/judge on luna   ~$0.009/paper  (n=13)
#   author/critic/judge on terra  ~$0.071/paper  (n=4)
# Terra is 10x luna's rate on both input and output; normalized for paper size
# the same ingests run ~9x dearer. Spend concentrates in two phases: `author`
# and `target_claims` (46K and 32K input tokens respectively across 4 papers).

base_url: https://api.openai.com/v1

roles:
  # Drafting — produces the page prose. Quality matters most here.
  author:
    provider: openai-compatible
    model: gpt-5.6-terra
    temperature: 0.5
    max_tokens: 6000

  # Critic — turns grader flags into revision notes.
  critic:
    provider: openai-compatible
    model: gpt-5.6-terra
    temperature: 0.3
    max_tokens: 2500

  # Judge — structural decisions (cross-link selection, memory evolution).
  judge:
    provider: openai-compatible
    model: gpt-5.6-terra
    temperature: 0.2
    max_tokens: 1500

  # Classifier — single JSON verdict, deterministic.
  classifier:
    provider: openai-compatible
    model: gpt-5.4-mini
    temperature: 0.1
    max_tokens: 200

  # Proposer — short-name / keyword lists.
  proposer:
    provider: openai-compatible
    model: gpt-5.6-luna
    temperature: 0.3
    max_tokens: 200

  # Extractor — title/authors/DOI/abstract from PDF first page.
  extractor:
    provider: openai-compatible
    model: gpt-5.4-mini
    temperature: 0.0
    max_tokens: 800

phases:
  author:           {role: author}
  evolve:           {role: author}
  debug:            {role: author, temperature: 0.2}
  critic:           {role: critic}
  classifier:       {role: classifier}
  short_name:       {role: proposer, max_tokens: 220}
  keywords:         {role: proposer}
  link_generation:  {role: judge, max_tokens: 1200}
  memory_evolution: {role: judge, max_tokens: 3000}
  synthesis_judge:  {role: judge}
  eval_judge:       {role: judge}
  reconcile:        {role: extractor}
  target_claims:    {role: judge, max_tokens: 8000}
  claim_support:    {role: judge}
