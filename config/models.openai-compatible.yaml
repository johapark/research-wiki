# Template — any cloud endpoint speaking the OpenAI chat-completions shape.
#
# Works with anything that exposes `/v1/chat/completions` in OpenAI format:
# OpenAI itself, Google Gemini's `/v1beta/openai/` shim, Groq, Together,
# Fireworks, DeepInfra, OpenRouter, Cerebras, Anyscale, paid LM Studio Cloud,
# etc. The framework's `openai-compatible` provider drives all of them
# without code changes — only the base URL, API key, and `model:` strings
# differ. (For *local* OpenAI-compatible servers — LM Studio, vLLM,
# llama.cpp, ollama — use models.lmstudio.yaml instead; same provider code
# path, conventions tuned for laptop-class hardware.)
#
# To use this template:
#   1. cp config/models.openai-compatible.yaml config/models.yaml
#   2. set `base_url:` below to your provider's endpoint (or export
#      RW_LLM_BASE_URL to override it ad-hoc)
#      export OPENAI_API_KEY="<your provider's API key>"   # forwarded as Bearer
#   3. Edit `model:` strings below to match your provider's catalog
#   4. researchwiki agent ingest inbox/<paper>.pdf
#
# The `base_url:` below is what folds the endpoint into the config: switching
# backends then rides on RW_MODELS_CONFIG alone, no paired RW_LLM_BASE_URL.
# The worked examples still show RW_LLM_BASE_URL= for the env-override path;
# put the same URL in `base_url:` to fold it in.
#
# ── Worked examples (base URL + auth) ──
#
#   OpenAI:
#     RW_LLM_BASE_URL=https://api.openai.com/v1
#     OPENAI_API_KEY=sk-...
#     models: gpt-5, gpt-5-mini, gpt-4.1, ...
#
#   Google Gemini (free tier OR paid):
#     RW_LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/
#     OPENAI_API_KEY=AIza...        # Gemini API key, forwarded as Bearer
#     models: gemini-3.5-flash, gemini-3.1-flash-lite, ...
#     Free-tier RPD is the binding constraint (RPD ÷ ~12 LLM-calls-per-paper
#     ≈ daily paper budget). Free-tier prompts/responses may be used by
#     Google to train — keep confidential PDFs on a paid tier or Anthropic.
#     Verify limits at https://ai.google.dev/gemini-api/docs/rate-limits.
#
#   Groq:
#     RW_LLM_BASE_URL=https://api.groq.com/openai/v1
#     OPENAI_API_KEY=gsk_...
#     models: llama-3.3-70b-versatile, qwen-2.5-32b, ...
#
#   OpenRouter (multi-model gateway, one key, many models):
#     RW_LLM_BASE_URL=https://openrouter.ai/api/v1
#     OPENAI_API_KEY=sk-or-v1-...
#     models: anthropic/claude-sonnet-4-6, google/gemini-3.5-flash, ...
#
# ── Defaults below: Gemini Flash / Flash-Lite ──
# Concrete, runnable example for a Gemini-keyed user. The split — Flash for
# author/critic/judge (drafting + scoring), Flash-Lite for classifier /
# proposer / extractor (one-line or JSON) — is a good shape for any provider
# with a "smart" + "cheap" pair. Swap both model strings for your provider's
# equivalents (e.g. gpt-5 + gpt-5-mini, or llama-70b + llama-8b on Groq).
#
# ── reasoning_effort sizing for thinking models ──
# Some providers (Gemini 2.5/3.x Flash, OpenAI o-series, …) run with thinking
# ON by default, and thinking tokens are deducted from `max_tokens` before any
# visible output. The OpenAI-spec `reasoning_effort` field (plumbed in
# researchwiki/agents/llm.py) bounds thinking cost so the budget reaches actual
# output. "low" is the right setting for ingest on Gemini Flash: enough
# thinking for the drafter to plan the page, not so much that flash output
# truncates. Tune per-provider — "minimal" to nearly eliminate thinking, or
# remove the line to let the provider decide. Providers that don't support the
# field (Flash-Lite, most non-thinking models) silently ignore it; the line is
# safe to leave in for portability.

# Provider endpoint (see the worked examples above). RW_LLM_BASE_URL, if set
# in .env, overrides this.
base_url: https://api.openai.com/v1

roles:
  # Drafting — produces the page prose. Quality matters most here.
  author:
    provider: openai-compatible
    model: gemini-3.5-flash
    temperature: 0.5
    max_tokens: 6000
    reasoning_effort: low

  # Critic — turns grader flags into revision notes.
  critic:
    provider: openai-compatible
    model: gemini-3.5-flash
    temperature: 0.3
    max_tokens: 2500
    reasoning_effort: low

  # Judge — structural decisions (cross-link selection, memory evolution).
  judge:
    provider: openai-compatible
    model: gemini-3.5-flash
    temperature: 0.2
    max_tokens: 1500
    reasoning_effort: low

  # Classifier — single JSON verdict, deterministic.
  classifier:
    provider: openai-compatible
    model: gemini-3.1-flash-lite
    temperature: 0.1
    max_tokens: 200

  # Proposer — short-name / keyword lists.
  proposer:
    provider: openai-compatible
    model: gemini-3.1-flash-lite
    temperature: 0.3
    max_tokens: 200

  # Extractor — title/authors/DOI/abstract from PDF first page.
  extractor:
    provider: openai-compatible
    model: gemini-3.1-flash-lite
    temperature: 0.0
    max_tokens: 800

phases:
  author:           {role: author}
  evolve:           {role: author}
  debug:            {role: author, temperature: 0.2}
  critic:           {role: critic}
  classifier:       {role: classifier}
  short_name:       {role: proposer, max_tokens: 220}
  keywords:         {role: proposer}
  link_generation:  {role: judge, max_tokens: 1200}
  memory_evolution: {role: judge, max_tokens: 3000}
  synthesis_judge:  {role: judge}
  eval_judge:       {role: judge}
  reconcile:        {role: extractor}
  target_claims:    {role: extractor, max_tokens: 4000}
  claim_support:    {role: judge}
