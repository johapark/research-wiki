schema_version: 1
split: heldout-questions
# Frozen before the first v0.6.0 model run. These are real PDFs already used by
# other benchmarks, not papers guaranteed unseen during model training.+# Expectations are reviewer-only and are never included in model prompts.
papers:
  chuai:
    stem: chuai-2018-deepcrispr-optimized-crispr-guide-rna
    page: 1
    start: "Here we present DeepCRISPR,"
    end: "DeepCRISPR is available"
  assa:
    stem: assa-2024-quantifying-allele-specific-crispr-editing-activity
    page: 1
    start: "Here, we introduce CRISPECTOR2.0,"
    end: "Graphical abstract"
  muslu:
    stem: muslu-2026-variantmedium-sensitive-and-generalizable-somatic
    page: 1
    start: "Methods Here we present VariantMedium,"
    end: "Conclusions"
  zhang:
    stem: zhang-2026-mga-a-tool-for-haplotype-mixed
    page: 1
    start: "Recent large-scale genome sequencing projects"
    end: "Keywords:"
  li:
    stem: li-2026-schilda-hierarchical-integration-of-llm
    page: 1
    start: "Cell type annotation in single-cell RNA sequencing"
    end: "By deeply integrating"
  fonseca:
    stem: fonseca-2026-adjunctive-ibuprofen-in-pre-extensively-drug-resistant
    page: 3
    start: "Drug-resistant tuberculosis remains"
    end: null
cases:
  - id: answer-deepcrispr
    operation: answer
    papers: [chuai]
    question: "What does DeepCRISPR predict, and what types of features does it learn?"
    expectation: useful
    required: ["on-target and off-target prediction", "sequence and epigenetic features"]
    gold_pages: {chuai: [1]}
  - id: answer-crispector
    operation: answer
    papers: [assa]
    question: "How does CRISPECTOR2.0 quantify allele-specific editing without a pre-specified personal genotype?"
    expectation: useful
    required: ["de novo sample-specific SNVs", "statistical allele calling", "measurement rather than a priori prediction"]
    gold_pages: {assa: [1, 2, 3, 4]}
  - id: answer-variantmedium-counts
    operation: answer
    papers: [muslu]
    question: "Which model components does VariantMedium combine, and how many variants and samples were used for training/validation and independent evaluation?"
    expectation: useful
    required: ["tree-based classifier and 3D DenseNet", "336,839 variants from 2,956 samples", "118,887 independent evaluation variants"]
    gold_pages: {muslu: [1, 2]}
  - id: answer-mga-scope
    operation: answer
    papers: [zhang]
    question: "Does MGA reconstruct both phased haplomes, or produce a haplotype-mixed assembly, and what sequencing input does it use?"
    expectation: useful
    required: ["haplotype-mixed mosaic", "HiFi reads alone", "no claim of separately reconstructed phased haplomes"]
    gold_pages: {zhang: [1, 2]}
  - id: answer-schilda
    operation: answer
    papers: [li]
    question: "How does scHilda use global knowledge and lineage-specific subgraphs to distinguish major cell lineages from cell subtypes?"
    expectation: useful
    required: ["global knowledge for major lineages", "focused lineage subgraphs for subtypes"]
    gold_pages: {li: [1, 2, 4]}
  - id: answer-ibuprofen-false-premise
    operation: answer
    papers: [fonseca]
    question: "Did adjunctive ibuprofen improve clinical outcomes in this trial, and what dose, duration, and group sizes were tested?"
    expectation: useful
    required: ["no demonstrated clinical benefit", "400 mg daily for 2 months", "28 participants, 14 per group", "exploratory pilot rather than conclusive efficacy evidence"]
    gold_pages: {fonseca: [3, 5, 6]}
  - id: answer-unrelated
    operation: answer
    papers: [zhang]
    question: "What ibuprofen dose improves tuberculosis culture conversion in this paper?"
    expectation: abstain
    required: ["no invented drug or clinical result from an assembly paper"]
    gold_pages: {zhang: [1]}
  - id: answer-invented-result
    operation: answer
    papers: [muslu]
    question: "What percentage of cancer patients were cured by VariantMedium in its randomized clinical trial?"
    expectation: abstain
    required: ["no invented clinical cure rate or randomized trial"]
    gold_pages: {muslu: [1, 2]}
  - id: synthesis-crispr
    operation: compose
    papers: [chuai, assa]
    title: "CRISPR prediction and allele-aware measurement"
    question: "How do DeepCRISPR prediction and CRISPECTOR2.0 allele-aware measurement address different stages of CRISPR assessment, and what evidence limits their interpretation?"
    expectation: useful
    required: ["prediction versus experimental measurement", "both papers substantively used", "no head-to-head performance ranking", "no unsupported causal account of distal SNVs"]
    gold_pages: {chuai: [1, 2, 8, 13], assa: [1, 2, 4, 8, 9]}
  - id: synthesis-knowledge-and-data
    operation: compose
    papers: [muslu, li]
    title: "Experimental labels and structured knowledge in biological prediction"
    question: "Compare how VariantMedium uses experimentally confirmed labels and scHilda uses structured biological knowledge to constrain prediction; distinguish their tasks and validation evidence without claiming a shared benchmark."
    expectation: useful
    required: ["experimental confirmation versus knowledge-guided hierarchy", "SNV calling versus cell annotation", "both papers substantively used", "no shared benchmark or proven cross-domain transfer"]
    gold_pages: {muslu: [1, 2, 7, 8], li: [1, 2, 4, 5]}
  - id: synthesis-unrelated-proof
    operation: compose
    papers: [zhang, fonseca]
    title: "Unsupported assembly and drug efficacy comparison"
    question: "Which shared clinical trial in these papers proves that MGA genome assembly increases the efficacy of adjunctive ibuprofen for tuberculosis?"
    expectation: abstain
    required: ["no invented common trial or causal efficacy relationship"]
    gold_pages: {zhang: [1], fonseca: [3, 5, 6]}
