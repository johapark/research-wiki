histories:
  allocation-rejected:
    - proposal_id: prop-b00000000001
      title: Retrieve, restructure, or reason?
      question: When should evidence systems retrieve more passages, reason, or restructure their corpus?
      thesis: A general decision framework for evidence access.
      status: rejected
      latest_feedback: >-
        Do not repeat a general decision framework or infer a winner from different
        benchmarks. Reconsider only a narrow controlled experiment on one task,
        with simpler baselines, an explicit rejection criterion, and separate
        accounting of online and amortized offline costs.
  memory-deferred:
    - proposal_id: prop-b00000000002
      title: Preserve every event and rebuild all derived memory after each correction
      question: Can versioned event storage prevent stale memory after a correction?
      thesis: Recompute all summaries and links after every correction.
      status: deferred
      latest_feedback: >-
        Full rebuilds and unlimited raw-event retention are unacceptable for this
        pilot. Narrow this to correcting a small user-selected memory subset with
        bounded retention and measured update work. Compare with a manual
        correction plus targeted retrieval baseline. Revise this proposal rather
        than proposing an independent memory architecture.

cases:
  - id: S01
    split: development
    group: agent-evidence
    family: synthesis
    evidence_set: retrieval
    target_category: ai
    topic: >-
      Propose a synthesis that helps choose among GraphRAG, RAPTOR, and HippoRAG
      for a research question. Identify a consequential distinction supported
      by the supplied evidence and explain the limits of the comparison.
    existing_pages: [synthesis/long-term-memory-systems-for-llm-agents]
  - id: I01
    split: development
    group: agent-evidence
    family: idea
    evidence_set: memory
    target_category: ai
    topic: >-
      Suggest an idea for durable, correctable agent memory beyond the context
      window. The general architecture survey already exists; find a narrower
      unresolved design question and a test that could reject your hypothesis.
    existing_pages: [synthesis/long-term-memory-systems-for-llm-agents, ideas/framework-upgrades-from-agent-memory-and-rag-literature]
  - id: X01
    split: development
    group: agent-evidence
    family: transfer
    evidence_set: pangenome-transfer
    cross_category: true
    target_category: compbio
    topic: >-
      Can a method from a different category help preserve nested variant
      relationships during graph-to-VCF conversion? Propose only an explicit
      source-method transfer grounded in this packet, with a simpler baseline.
  - id: R01
    split: development
    group: agent-evidence
    family: restraint
    evidence_set: unrelated
    target_category: ai
    topic: >-
      Suggest a synthesis comparing fabrication conditions for
      superconducting qubits using measured coherence times and material defects.
      Stay within this topic and the supplied evidence; abstain if unsupported.
  - id: F01
    split: development
    group: agent-evidence
    family: feedback
    evidence_set: allocation
    history: allocation-rejected
    target_category: ai
    topic: >-
      Revisit the rejected retrieve/reason/restructure proposal in light of its
      feedback. Propose a material revision only if the supplied evidence supports it.
  - id: X02
    split: development
    group: agent-evidence
    family: transfer
    evidence_set: pangenome-transfer
    # Paired evidence removal: retain the target, remove the only source method.
    exclude_sources: [graph-memory]
    paired_with: X01
    pair_change: source_method_removed
    cross_category: true
    target_category: compbio
    topic: >-
      Can a method from a different category help preserve nested variant
      relationships during graph-to-VCF conversion? Propose only an explicit
      source-method transfer grounded in this packet, with a simpler baseline.
  - id: R02
    split: development
    group: agent-evidence
    family: restraint
    evidence_set: memory
    paired_with: I01
    pair_change: scope_closed_to_existing_page
    target_category: ai
    topic: >-
      Suggest a new general synthesis of durable LLM-agent memory only if the
      supplied existing synthesis does not already cover the external-store,
      writing, retrieval, and representation blueprint. Do not suggest narrower
      design ideas or extend the scope. Return no proposals if it is covered.
    existing_pages: [synthesis/long-term-memory-systems-for-llm-agents]
  - id: F02
    split: development
    group: agent-evidence
    family: feedback
    evidence_set: memory
    history: memory-deferred
    paired_with: I01
    pair_change: bounded_correction_feedback
    target_category: ai
    topic: >-
      Revise the deferred memory-correction proposal to satisfy the attached
      feedback. Keep the pilot small, bound retained data and update work, and
      explain how its comparison could show that the extra mechanism is unnecessary.
  - id: S02
    split: heldout
    group: chromatin
    family: synthesis
    evidence_set: chromatin
    target_category: compbio
    topic: >-
      Suggest a synthesis explaining how the substrate used for off-target
      discovery changes what a cleavage assay can tell us about editing in cells.
      Compare the supplied assays and identify what still needs cellular validation.
  - id: S03
    split: heldout
    group: reference-mapping
    family: synthesis
    evidence_set: mapping
    target_category: single-cell
    topic: >-
      Suggest a synthesis that helps choose between the supplied single-cell
      atlas-mapping approaches for unfamiliar query biology. Identify a
      consequential methodological distinction and the limits of the evidence.
  - id: I02
    split: heldout
    group: pixel-optimization
    family: idea
    evidence_set: pixels
    target_category: ai
    topic: >-
      Propose one narrowly testable way to accelerate palette-constrained pixel
      abstraction using the supplied optimization work. Preserve the output grid
      and user palette constraints; establish whether the speedup survives those requirements.
  - id: I03
    split: heldout
    group: clustering-stability
    family: idea
    evidence_set: stability
    target_category: single-cell
    topic: >-
      Propose one narrowly testable idea for improving confidence in single-cell
      clustering using the supplied methods. Explain what could make the reported
      stability misleading and how your test would detect that problem.
