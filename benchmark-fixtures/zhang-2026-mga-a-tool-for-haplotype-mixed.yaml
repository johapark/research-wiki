paper_stem: zhang-2026-mga-a-tool-for-haplotype-mixed
paper_type: method-with-benchmarks
title: "MGA: a tool for haplotype-mixed assembly of long and accurate reads"
published_at: "2026-06-17"
notes: |
  Genome-assembly method paper. MGA extends LJA's de Bruijn graph framework
  with additional graph-simplification operations (detouring, dewhirling,
  decoupling, tip-repair, short-edge contracting) to produce near-complete
  haplotype-mixed consensus assemblies from HiFi reads alone — no ONT,
  Hi-C, or trio data required. Compared head-to-head against hifiasm,
  Falcon, HiCanu, and LJA+purge_dups on two fungi and four mammalian
  genomes.

  Watch out for: the phase-switch rate on RUST / RUST-Pst is biased in
  favor of hifiasm (evaluated against hifiasm-assembled diploid
  references). Authors acknowledge this explicitly.

headline_claims:
  - id: bonobo-n50-vs-hifiasm
    importance: critical
    verbalization: |
      On the BONOBO genome (24 chromosomes, ~3.1 Gb haplomes, 14M HiFi reads),
      MGA achieved contig N50 of 108.5 Mb versus hifiasm's 77.3 Mb.
    relation:
      subject: "MGA BONOBO contig N50"
      ratio: "108.5 Mb"
      comparator: "hifiasm (77.3 Mb)"
    location: "Table 2, p.10"

  - id: human-n50-vs-hifiasm
    importance: critical
    verbalization: |
      On the HUMAN HG002 genome, MGA achieved contig N50 of 143.4 Mb versus
      hifiasm's 95.4 Mb, and N90 of 66.8 Mb versus hifiasm's 36.5 Mb.
    relation:
      subject: "MGA HUMAN contig N50"
      ratio: "143.4 Mb"
      comparator: "hifiasm (95.4 Mb)"
    location: "Table 2, p.10"

  - id: giraffe-n50-vs-hifiasm
    importance: critical
    verbalization: |
      On the GIRAFFE Masai-giraffe genome, MGA achieved contig N50 of 167.0 Mb
      versus hifiasm's 109.4 Mb.
    relation:
      subject: "MGA GIRAFFE contig N50"
      ratio: "167.0 Mb"
      comparator: "hifiasm (109.4 Mb)"
    location: "Table 2, p.10"

  - id: rustsim-phase-switch-vs-hifiasm
    importance: high
    verbalization: |
      On the RUSTsim simulated dataset (single chromosome from the Puccinia
      triticina leaf-rust fungus), MGA and hifiasm both assembled a single
      consensus contig, but MGA achieved a lower phase-switch rate of 1.2%
      versus hifiasm's 2.1%.
    relation:
      subject: "MGA RUSTsim phase-switch rate"
      ratio: "1.2%"
      comparator: "hifiasm (2.1%)"
    location: "Table 1, p.9"

  - id: hifi-only-input
    importance: critical
    verbalization: |
      MGA generates near-complete haplotype-mixed assemblies from HiFi reads
      alone, without requiring ONT ultra-long reads, Hi-C, parent-child trio
      Illumina, or Bionano optical maps that current T2T diploid workflows use.
    location: "Abstract; Background, p.2"

  - id: graph-simplification-operations
    importance: high
    verbalization: |
      MGA's graph-simplification module extends bubble collapsing with five
      operations: detouring, dewhirling, decoupling, broken-tip repairing, and
      short-edge contracting. These transform the multi-de-Bruijn graph
      multiDBk(Reads*) into multiDBConsensusk(Reads*).
    location: "Fig. 3 / Graph simplification section, p.7"

  - id: rust-near-complete-chromosomes
    importance: high
    verbalization: |
      On the RUST leaf-rust fungus dataset (18 chromosomes), MGA assembled all
      18 chromosomes into near-complete consensus contigs while hifiasm
      assembled 17 chromosomes near-complete but broke chromosome 17 (which
      contains an extra-long rDNA repeat) into multiple contigs.
    location: "Assembly of the RUST dataset, p.13"

capabilities:
  - id: assembles-mammalian-genomes
    importance: critical
    verbalization: |
      Successfully assembles multi-Gb mammalian genomes — bonobo, human HG002,
      Masai giraffe, and sheep — from HiFi reads alone, matching or exceeding
      hifiasm's contiguity on every benchmark.
    location: "Table 2 + Fig. 4, p.10"

  - id: fungi-benchmarks
    importance: high
    verbalization: |
      Benchmarked on two fungi genomes (Puccinia triticina Pt, Puccinia
      striiformis f. sp. tritici Pst), both wheat pathogens with high
      heterozygosity (0.7% and 0.3%).
    location: "Datasets section + Table 1, p.9"

  - id: hrr-modeling
    importance: normal
    verbalization: |
      Handles highly repetitive regions (HRRs) — rDNA repeats, centromeres —
      by modeling them as contracted nodes with representative units rather
      than attempting full sequence assembly.
    location: "Contracting short edges panel, Fig. 3E"

limitations:
  - id: phase-switch-bias-against-hifiasm-refs
    importance: high
    verbalization: |
      Phase-switch rate comparisons on RUST and RUST-Pst are biased in favor
      of hifiasm because those references were themselves generated by
      hifiasm in diploid mode. Authors flag this explicitly.
    location: "Assembly of the RUST-Pst dataset, p.13"

  - id: haplotype-mixed-not-diploid
    importance: high
    verbalization: |
      MGA produces haplotype-mixed consensus assemblies, not phased diploid
      assemblies. Applications that require both haplomes separately (e.g.,
      medical genomics) still need diploid assemblers or additional phasing.
    location: "Abstract + Background, p.1-2"

  - id: hrr-not-fully-resolved
    importance: normal
    verbalization: |
      HRRs are modeled with a representative unit and approximate copy number
      rather than fully assembled. This is a deliberate design choice given
      population-level HRR variability but means MGA does not produce
      truly telomere-to-telomere assemblies.
    location: "Background, p.3; Contracting short edges, Fig. 3E"

