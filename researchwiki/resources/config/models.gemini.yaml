# Google Gemini via its OpenAI-compatible endpoint.
#
# Uses the `openai-compatible` provider. The endpoint is folded into the
# `base_url:` key below, so the only thing .env needs is the API key:
#   OPENAI_API_KEY=AIza...        # Gemini API key, forwarded as Bearer
# (An RW_LLM_BASE_URL in .env still overrides base_url if you ever set it.)
#
# Free-tier RPM is the binding constraint in practice, not RPD: observed
# 429s report `generate_content_free_tier_requests, limit: 5` for
# gemini-3.5-flash with a ~45-60s retry-after — i.e. ~5 requests/minute,
# shared per-project (not per-key), across every parallel author/critic/
# judge call. `agent ingest`'s default batch concurrency (4 workers) plus
# 2 parallel author drafts per paper blows through that instantly — pass
# `-w 1` (serialize the batch) when running on the free tier; drop to
# `-n 1` too if 429s persist even serialized. Flash-Lite calls (classifier/
# proposer/extractor) did not 429 in testing, so the tier's ceiling appears
# to bite hardest on the Flash model specifically. Free-tier prompts/
# responses may be used by Google to train — keep confidential PDFs on a
# paid tier or Anthropic. Verify current limits at
# https://ai.google.dev/gemini-api/docs/rate-limits.
#
# Split: Flash for author/critic/judge (drafting + scoring), Flash-Lite for
# classifier/proposer/extractor (one-line or JSON) — mirrors the Sonnet/Haiku
# split in models.anthropic.yaml.
#
# reasoning_effort: low — Gemini Flash runs with thinking ON by default, and
# thinking tokens are deducted from max_tokens before any visible output.
# "low" bounds thinking cost so the budget reaches actual output; enough for
# the drafter to plan the page without truncating flash output.
#
# rpm — client-side requests-per-minute cap (see llm._throttle). Set to each
# model's free-tier RPM ceiling so calls are paced evenly instead of bursting
# into 429s: gemini-3.5-flash = 5 RPM, gemini-3.1-flash-lite = 15 RPM. The cap
# is keyed by model, so the three Flash roles share one 5 RPM budget and the
# three Flash-Lite roles share one 15 RPM budget. Lower these if 429s persist;
# raise/remove on a paid tier.
#
# Phases fall back to _FALLBACK_PHASES via the config merge, so only roles
# need defining here.
#
# ingest.n_drafts: default author-draft count when `-n` is omitted. Set to 1
# on this rate-limited free tier — a 2-draft tournament doubles the (5 RPM /
# 20 RPD) Flash author calls for marginal quality gain. CLI `-n` still wins.

base_url: https://generativelanguage.googleapis.com/v1beta/openai/

ingest:
  n_drafts: 1

roles:
  author:
    provider: openai-compatible
    model: gemini-3.5-flash
    temperature: 0.5
    max_tokens: 6000
    reasoning_effort: low
    rpm: 5

  critic:
    provider: openai-compatible
    model: gemini-3.5-flash
    temperature: 0.3
    max_tokens: 2500
    reasoning_effort: low
    rpm: 5

  judge:
    provider: openai-compatible
    model: gemini-3.5-flash
    temperature: 0.2
    max_tokens: 1500
    reasoning_effort: low
    rpm: 5

  classifier:
    provider: openai-compatible
    model: gemini-3.1-flash-lite
    temperature: 0.1
    max_tokens: 200
    rpm: 15

  proposer:
    provider: openai-compatible
    model: gemini-3.1-flash-lite
    temperature: 0.3
    max_tokens: 200
    rpm: 15

  extractor:
    provider: openai-compatible
    model: gemini-3.1-flash-lite
    temperature: 0.0
    max_tokens: 800
    rpm: 15
