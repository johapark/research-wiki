# GLM-4.7-Flash via z.ai's Anthropic-compatible endpoint (free tier).
#
# Uses the `anthropic` provider — the anthropic SDK reads ANTHROPIC_API_KEY and
# ANTHROPIC_BASE_URL from the env, so route to z.ai with:
#   export ANTHROPIC_API_KEY="<z.ai key>"
#   export ANTHROPIC_BASE_URL="https://api.z.ai/api/anthropic"   # NO trailing /v1
# The SDK appends /v1/messages, so the base URL must stop at /anthropic.
#
# All roles on glm-4.7-flash (free). Phases fall back to _FALLBACK_PHASES via the
# config merge, so only roles need defining here.

roles:
  author:
    provider: anthropic
    model: glm-4.7-flash
    temperature: 0.5
    max_tokens: 6000

  critic:
    provider: anthropic
    model: glm-4.7-flash
    temperature: 0.3
    max_tokens: 2500

  judge:
    provider: anthropic
    model: glm-4.7-flash
    temperature: 0.2
    max_tokens: 1500

  classifier:
    provider: anthropic
    model: glm-4.7-flash
    temperature: 0.1
    max_tokens: 200

  proposer:
    provider: anthropic
    model: glm-4.7-flash
    temperature: 0.3
    max_tokens: 200

  extractor:
    provider: anthropic
    model: glm-4.7-flash
    temperature: 0.0
    max_tokens: 800
