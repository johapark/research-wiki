# Template — local LLM via LM Studio (OpenAI-compatible endpoint).
#
# Routes every role to a single local model served by LM Studio. No API key,
# no per-paper cost; throughput is bounded by your hardware, not a rate limit.
# Default model here is Qwen3.6-35B-A3B (MLX build) — a 35B mixture-of-experts
# with ~3B active params per token, capable enough to run the drafting and
# judging roles a 7-8B model would struggle with, while staying laptop-class
# on Apple Silicon.
#
# To use this template:
#   1. Start LM Studio, load `qwen3.6-35b-a3b-mlx`, click Start Server.
#      Confirm: curl http://localhost:1234/v1/models | jq '.data[].id'
#   2. cp config/models.lmstudio.yaml config/models.yaml
#   3. (only if not on the default port) edit `base_url:` below.
#      No ANTHROPIC_API_KEY needed — readiness checks are provider-aware.
#   4. researchwiki agent ingest inbox/<paper>.pdf
#
# ── Pure-local, no API key ──
# `has_synchronous_llm()` returns true on a local-LM signal alone, so leave
# ANTHROPIC_API_KEY unset on a pure-local box (no `=not-used` workaround).
#
# ── Mix-by-role is the cheaper lever on weaker hardware ──
# If you'd rather keep fidelity-critical phases on Anthropic, flip just the
# `author` and `judge` roles back to `provider: anthropic` and leave the cheap
# high-volume roles (classifier / proposer / extractor) here. See the README
# "Local LLMs" section for the recommended split.
#
# ── Thinking models — budgets are generous ON PURPOSE ──
# Qwen3.6 ALWAYS thinks: this MLX build emits ~300–2700 reasoning tokens
# before any answer, and those tokens are deducted from `max_tokens` first.
# `/no_think`, `chat_template_kwargs.enable_thinking=false`, and
# `reasoning_effort` are all IGNORED by this build (verified) — you cannot
# turn thinking off, so you must budget around it. If max_tokens is too small
# the response truncates mid-thought and `content` comes back EMPTY: a blank
# page body, a garbled JSON verdict, a wrong stem. That's the failure mode
# that sinks every role if you size budgets for a non-thinking model.
#
# Fix: every budget below = desired output + a thinking headroom, sized
# generously. Local compute is ~free per token (you pay wall-clock, not $),
# and the model stops on its own (`finish_reason=stop`) well before the cap,
# so a high ceiling costs nothing on a normal turn — it only prevents the
# empty-content truncation. Empirically a full page draft uses ~2700 thinking
# + ~1200 output tokens; budgets here run well above that (author 16000) so
# even an unusually long thinking trace on a dense paper can't truncate the
# answer. When in doubt, bias high — the only cost of a big cap is unused.

# LM Studio's default OpenAI-compatible endpoint. Folded in here so a
# backend switch rides on RW_MODELS_CONFIG alone; change the port/host if
# you serve elsewhere. An RW_LLM_BASE_URL in .env still overrides this.
base_url: http://localhost:1234/v1

ingest:
  # Char budget for the target-claims extraction prompt. The extractor is fed
  # the whole substantive paper (references excluded) up to this many chars.
  # The default (120K ≈ 30K tokens) assumes cloud-scale context; on a 32K-ctx
  # local model that would overflow once the target_claims thinking budget
  # (16000) is added. 40K chars ≈ 10K tokens leaves ~22K for thinking+output.
  # Raise this if you serve the model at a larger context (e.g. 64K).
  target_claims_max_chars: 40000

roles:
  # Drafting — produces the page prose. Quality matters most here.
  author:
    provider: lmstudio
    model: qwen3.6-35b-a3b-mlx
    temperature: 0.5
    max_tokens: 16000

  # Critic — turns grader flags into revision notes.
  critic:
    provider: lmstudio
    model: qwen3.6-35b-a3b-mlx
    temperature: 0.3
    max_tokens: 12000

  # Judge — structural decisions (cross-link selection, memory evolution).
  judge:
    provider: lmstudio
    model: qwen3.6-35b-a3b-mlx
    temperature: 0.2
    max_tokens: 12000

  # Classifier — single JSON verdict, but thinking still runs first.
  classifier:
    provider: lmstudio
    model: qwen3.6-35b-a3b-mlx
    temperature: 0.1
    max_tokens: 6000

  # Proposer — short-name / keyword lists (tiny output, real thinking).
  proposer:
    provider: lmstudio
    model: qwen3.6-35b-a3b-mlx
    temperature: 0.3
    max_tokens: 6000

  # Extractor — title/authors/DOI/abstract from PDF first page. Undersizing
  # this is what produced a garbled stem on the first run.
  extractor:
    provider: lmstudio
    model: qwen3.6-35b-a3b-mlx
    temperature: 0.0
    max_tokens: 8000

phases:
  # Phase max_tokens overrides are raised too — a thinking model needs
  # headroom even for "short" outputs, or the answer truncates to empty.
  author:           {role: author}
  evolve:           {role: author}
  debug:            {role: author, temperature: 0.2}
  critic:           {role: critic}
  classifier:       {role: classifier}
  short_name:       {role: proposer, max_tokens: 6000}
  keywords:         {role: proposer}
  link_generation:  {role: judge, max_tokens: 12000}
  memory_evolution: {role: judge, max_tokens: 12000}
  synthesis_judge:  {role: judge}
  eval_judge:       {role: judge}
  claim_support:    {role: judge, max_tokens: 12000}
  reconcile:        {role: extractor}
  # These three inherit tiny budgets from _FALLBACK_PHASES (target_claims
  # 2500, the two judges 400) — fine for low-thinking cloud models but far
  # too small for an always-thinking local model, which spends the whole
  # budget reasoning and returns EMPTY content (a skipped target-claims
  # checklist, a dropped cross-link verdict). Raise them like the rest.
  target_claims:       {role: extractor, max_tokens: 16000}
  cross_paper_judge:   {role: judge, temperature: 0.0, max_tokens: 12000}
  claim_overlap_judge: {role: judge, temperature: 0.0, max_tokens: 12000}
