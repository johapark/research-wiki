<script>
'use strict';

__DASHBOARD_SEARCH__
let DATA=JSON.parse(document.getElementById('dashboard-data').textContent);
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const fmt=n=>Number(n).toLocaleString(), label=s=>({cgt:'Cell & gene therapy',compbio:'Computational biology',ai:'Artificial intelligence',genomics:'Genomics',genetics:'Genetics','single-cell':'Single cell',statistics:'Statistics',other:'Other',synthesis:'Synthesis',ideas:'Ideas',proposals:'Proposals',references:'References',concepts:'Concepts'}[s]||s.replace(/-/g,' '));
const typeLabel=s=>({paper:'Paper',commentary:'Commentary',synthesis:'Synthesis',idea:'Idea',proposal:'Proposal',guidance:'Guidance',protocol:'Protocol',whitepaper:'Whitepaper',book:'Book',concept:'Concept'}[s]||s);
const VIEWS={overview:['Overview','grid'],library:['All pages','book'],paper:['Papers','file'],synthesis:['Syntheses','map'],idea:['Ideas','bulb'],proposal:['Proposals','layers'],references:['References','book'],saved:['Saved pages','save'],inbox:['Inbox','inbox'],attention:['Needs attention','alert']};
const defaults={view:'overview',q:'',category:'',type:'',year:'',status:'',sort:'added',layout:'table',p:1,id:'',anchor:'',section:''};
let state={...defaults}, byId=new Map(),byStem=new Map(),saved=new Set(),readerScale=100,readerFont='source',historyDepth=0,lastLocation='',searchTimer,toastTimer,etag='',localSearch=null,searchVersion=0,searchController=null;
let searchState={query:null,hits:new Map(),loading:false,error:'',fallback:false};
const READER_FONTS={source:'"Source Serif 4","Times New Roman",serif',snujaha:'"SNU Jaha","Source Serif 4","Times New Roman",serif',system:'var(--sans)'};
const storageKey=()=>`researchwiki-dashboard:${DATA.meta.repository}`;
function readPreferences(){try{const p=JSON.parse(localStorage.getItem(storageKey())||'{}');saved=new Set(Array.isArray(p.saved)?p.saved:[]);state.layout=p.layout==='cards'?'cards':'table';if(p.theme)document.documentElement.dataset.theme=p.theme;if(Number.isFinite(p.readerScale))readerScale=p.readerScale;if(p.readerFont==='georgia'){p.readerFont='source';localStorage.setItem(storageKey(),JSON.stringify(p));}if(Object.keys(READER_FONTS).includes(p.readerFont))readerFont=p.readerFont;}catch(_){} }
function persist(){try{localStorage.setItem(storageKey(),JSON.stringify({saved:[...saved],layout:state.layout,theme:document.documentElement.dataset.theme||'light',readerScale,readerFont}));}catch(_){} }
function setReaderFont(value,save=true){
 readerFont=Object.keys(READER_FONTS).includes(value)?value:'source';
 $('reader').style.setProperty('--reader-font',READER_FONTS[readerFont]);$('reader-font-family').value=readerFont;
 if(save)persist();
}
function setReaderScale(value,save=true){
 readerScale=Math.max(80,Math.min(200,Math.round(value/10)*10));
 $('reader').style.setProperty('--reader-scale',readerScale/100);
 $('reader-font-value').textContent=readerScale+'%';
 $('reader-font-down').disabled=readerScale===80;$('reader-font-up').disabled=readerScale===200;
 if(save)persist();
}
function rebuild(){byId=new Map(DATA.pages.map(p=>[p.id,p]));byStem=new Map();for(const p of DATA.pages){const matches=byStem.get(p.stem)||[];matches.push(p.id);byStem.set(p.stem,matches);}localSearch=null;searchVersion++;searchController?.abort();searchState={query:null,hits:new Map(),loading:false,error:'',fallback:false};}
function localResults(query){localSearch??=new DashboardSearch(DATA.pages);return localSearch.query(query);}
function queryHits(){
 const query=state.q.trim();
 if(!query){if(searchState.query){searchVersion++;searchController?.abort();}searchState={query:'',hits:new Map(),loading:false,error:'',fallback:false};return searchState.hits;}
 if(searchState.query===query)return searchState.hits;
 if(!DATA.meta.live){searchState={query,hits:new Map(localResults(query).map(hit=>[hit.id,hit])),loading:false,error:'',fallback:false};return searchState.hits;}
 searchState={query,hits:new Map(),loading:true,error:'',fallback:false};requestSearch(query);return searchState.hits;
}
async function requestSearch(query){
 const version=++searchVersion;searchController?.abort();const controller=new AbortController();searchController=controller;
 const timer=setTimeout(()=>controller.abort(),5000);
 try{
  const params=new URLSearchParams({q:query,limit:String(Math.min(10000,Math.max(1000,DATA.pages.length*2)))});
  const response=await fetch('/api/search?'+params,{signal:controller.signal,cache:'no-store'});
  const payload=await response.json();if(version!==searchVersion)return;
  if(response.status===400){searchState={query,hits:new Map(),loading:false,error:'Finish any quoted phrase or check the search syntax.',fallback:false};}
  else if(response.ok){searchState={query,hits:new Map(payload.hits.map(hit=>[hit.id,hit])),loading:false,error:'',fallback:false};}
  else throw new Error('Live search unavailable');
 }catch(_){if(version!==searchVersion)return;searchState={query,hits:new Map(localResults(query).map(hit=>[hit.id,hit])),loading:false,error:'',fallback:true};}
 finally{clearTimeout(timer);if(version===searchVersion&&state.q.trim()===query)renderResults();}
}
function readHash(){const h=new URLSearchParams(location.hash.slice(1));for(const k of Object.keys(defaults))if(h.has(k))state[k]=h.get(k);if(!VIEWS[state.view])state.view='overview';state.p=Math.max(1,parseInt(state.p,10)||1);if(!['cards','table'].includes(state.layout))state.layout='table';if(!['relevance','added','year','title','links'].includes(state.sort))state.sort='added';if(state.q.trim()&&!h.has('sort'))state.sort='relevance';if(!state.q.trim()&&state.sort==='relevance')state.sort='added';}
function savedHistoryDepth(){const h=history.state;return h?.dashboardRepository===DATA.meta.repository&&Number.isInteger(h.dashboardDepth)&&h.dashboardDepth>0?h.dashboardDepth:0;}
function writeHash(push=false){
 const h=new URLSearchParams();for(const [k,v] of Object.entries(state))if(v!==defaults[k]&&v!=='')h.set(k,String(v));
 const url=location.pathname+location.search+(h.size?'#'+h.toString():'');
 const sameUrl=url===location.pathname+location.search+location.hash;
 const add=push&&(!sameUrl||Boolean(state.section));
 if(add){
  if($('reader').open)history.replaceState({...history.state,readerScroll:$('reader-scroll').scrollTop},'');
  historyDepth++;
 }
 const readerScroll=sameUrl&&!add?history.state?.readerScroll:null;
 history[add?'pushState':'replaceState']({...history.state,readerScroll,dashboardRepository:DATA.meta.repository,dashboardDepth:historyDepth},'',url);
 lastLocation=location.href;
}
function date(s,short=false){if(!s)return 'Undated';const d=new Date(s);return Number.isNaN(d.valueOf())?'Undated':d.toLocaleDateString(undefined,short?{month:'short',day:'numeric'}:{year:'numeric',month:'short',day:'numeric'});}
function tokens(q){return [...q.toLocaleLowerCase().matchAll(/"([^"]+)"|(\S+)/g)].map(m=>m[1]||m[2]);}
function highlight(text,id){const raw=String(text??''),words=[...tokens(state.q),...(searchState.hits.get(id)?.terms||[])].filter(w=>w.length>1).sort((a,b)=>b.length-a.length);if(!words.length)return esc(raw);const safe=words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')),pattern=new RegExp(`(${safe.join('|')})`,'gi');let out='',offset=0;for(const match of raw.matchAll(pattern)){out+=esc(raw.slice(offset,match.index))+`<mark>${esc(match[0])}</mark>`;offset=match.index+match[0].length;}return out+esc(raw.slice(offset));}
function visible(){const hits=queryHits(),searching=Boolean(state.q.trim());const referenceTypes=['guidance','protocol','whitepaper','book'];return DATA.pages.filter(p=>{
 if(['paper','synthesis','idea','proposal'].includes(state.view)&&p.type!==state.view)return false;
 if(state.view==='references'&&!referenceTypes.includes(p.type))return false;
 if(state.view==='saved'&&!saved.has(p.id))return false;
 if(state.view==='attention'&&!p.flags.length)return false;
 return (!state.category||p.category===state.category||p.topics.includes(state.category))&&(!state.type||p.type===state.type)&&(!state.year||String(p.year)===state.year)&&(!state.status||p.status===state.status)&&(!searching||hits.has(p.id));
 }).sort((a,b)=>{if(state.sort==='relevance'){const delta=(hits.get(b.id)?.score||0)-(hits.get(a.id)?.score||0);if(delta)return delta;}if(state.sort==='title')return a.title.localeCompare(b.title);if(state.sort==='year')return (b.year||0)-(a.year||0)||a.title.localeCompare(b.title);if(state.sort==='links')return (b.links.length+b.backlinks.length)-(a.links.length+a.backlinks.length)||a.title.localeCompare(b.title);return (Date.parse(b.added)||0)-(Date.parse(a.added)||0)||a.title.localeCompare(b.title);});}
function options(id,first,values,selected){$(id).innerHTML=`<option value="">${first}</option>`+values.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('');$(id).value=selected;if($(id).value!==selected)state[id]='';}
function filters(){options('category','All categories',[...new Set(DATA.pages.flatMap(p=>[p.category,...p.topics]))].sort().map(s=>[s,label(s)]),state.category);options('type','All page types',Object.keys(DATA.meta.types).map(t=>[t,typeLabel(t)]),state.type);options('year','All years',[...new Set(DATA.pages.map(p=>p.year).filter(Boolean))].sort((a,b)=>b-a).map(y=>[String(y),String(y)]),state.year);options('status','All statuses',[...new Set(DATA.pages.map(p=>p.status).filter(Boolean))].sort().map(s=>[s,s]),state.status);$('status').hidden=!['idea','proposal','library','saved','attention'].includes(state.view);$('type').hidden=['paper','synthesis','idea','proposal'].includes(state.view);$('sort').querySelector('option[value=relevance]').hidden=!state.q.trim();$('sort').value=state.sort;$('search').value=state.q;$('table-view').setAttribute('aria-pressed',state.layout==='table');$('card-view').setAttribute('aria-pressed',state.layout==='cards');}
function navigate(view,extra={}){clearTimeout(searchTimer);state={...defaults,layout:state.layout,view,...extra};if(state.q.trim())state.sort='relevance';closeReader();render();writeHash(true);$('sidebar').classList.remove('open');window.scrollTo({top:0});}
function nav(){const counts={library:DATA.pages.length,paper:DATA.meta.types.paper||0,synthesis:DATA.meta.types.synthesis||0,idea:DATA.meta.types.idea||0,proposal:DATA.meta.types.proposal||0,references:DATA.pages.filter(p=>['guidance','protocol','whitepaper','book'].includes(p.type)).length,saved:DATA.pages.filter(p=>saved.has(p.id)).length,inbox:DATA.inbox.length,attention:DATA.pages.filter(p=>p.flags.length).length};const button=k=>`<button data-view="${k}" ${state.view===k?'aria-current="page"':''}>${icon(VIEWS[k][1])}<span>${VIEWS[k][0]}</span>${k==='overview'?'':`<span class="nav-count">${fmt(counts[k]||0)}</span>`}</button>`;$('navigation').innerHTML=['overview','library','paper','synthesis','idea','proposal','references','saved'].map(button).join('');$('workflow-nav').innerHTML=['inbox','attention'].map(button).join('');$('repo-name').textContent=DATA.meta.repository;$('release-version').textContent=`v${DATA.meta.version}`;}
function stats(){const n=DATA.meta.types,active=DATA.pages.filter(p=>p.type==='idea'&&['open','scoping','validated'].includes(p.status)).length,queue=DATA.pages.filter(p=>p.type==='proposal'&&p.status==='proposed').length;const cards=[['Papers',n.paper||0,'file','paper'],['Syntheses',n.synthesis||0,'map','synthesis'],['Active ideas',active,'bulb','idea'],['Awaiting review',queue,'layers','proposal']];$('stats').innerHTML=cards.map(([name,count,i,view])=>`<button class="stat" data-view="${view}" ${name==='Awaiting review'?'data-status="proposed"':''}><span class="stat-label">${icon(i)}${name}</span><span class="stat-number">${fmt(count)}</span></button>`).join('');}
function bookmark(p){return `<button class="bookmark" data-save="${esc(p.id)}" aria-label="${saved.has(p.id)?'Unsave':'Save'} ${esc(p.short_name||p.title)}" aria-pressed="${saved.has(p.id)}">${icon('save')}</button>`;}
function pill(p){return `<span class="pill ${esc(p.type)}">${esc(typeLabel(p.type))}</span>`;}
function titleBlock(p){return `<button class="plain page-link" data-page="${esc(p.id)}"><span class="row-title">${highlight(p.short_name||p.title,p.id)}</span><span class="row-subtitle">${highlight(p.short_name?p.title:p.hook||p.topic_seed||p.authors,p.id)}</span></button><div class="row-meta">${p.venue?`${esc(p.venue)}${p.year?' · '+p.year:''}`:esc(p.status||label(p.category))}${bookmark(p)}</div>`;}
function table(rows){return `<table class="library-table"><thead><tr><th scope="col">Document</th><th scope="col">Category</th><th scope="col">Type</th><th scope="col">Added</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${titleBlock(p)}</td><td class="row-cat">${esc(label(p.category))}</td><td>${pill(p)}</td><td class="row-date" title="${esc(date(p.added))}">${date(p.added,true)}</td></tr>`).join('')}</tbody></table>`;}
function cards(rows){return `<div class="cards">${rows.map(p=>`<article class="page-card"><div class="card-top">${pill(p)}${bookmark(p)}</div><button class="plain page-link" data-page="${esc(p.id)}"><span class="row-title">${highlight(p.short_name||p.title,p.id)}</span><span class="row-subtitle">${highlight(p.hook||p.title,p.id)}</span></button><div class="card-foot"><span>${esc(p.status||label(p.category))}</span><span>${date(p.added,true)}</span></div></article>`).join('')}</div>`;}
function empty(title,text,clear=true){return `<div class="empty">${icon('search')}<h3>${title}</h3><p>${text}</p>${clear?'<button class="small-btn" id="reset">Clear filters</button>':''}</div>`;}
function renderResults(){const inbox=state.view==='inbox';$('controls').hidden=inbox;$('results-note').hidden=inbox;const rows=visible(),size=state.view==='overview'?8:25,total=Math.max(1,Math.ceil(rows.length/size));if(!searchState.loading)state.p=Math.min(state.p,total);const start=(state.p-1)*size,shown=rows.slice(start,start+size);$('browse-all').hidden=state.view!=='overview';$('list-heading').textContent=state.view==='overview'?'Latest in the library':inbox?'Ready to ingest':`${VIEWS[state.view][0]}`;$('list-description').textContent=inbox?'Original PDF drops awaiting the normal ingest workflow.':state.view==='attention'?'Metadata and source-file checks; research prose stays unchanged.':state.view==='saved'?'Your reading list, stored in this browser.':'Browse the Markdown library, including pages without date stamps.';
 if(inbox){$('results').innerHTML=DATA.inbox.length?`<div class="inbox-list">${DATA.inbox.map(p=>`<div class="inbox-file"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a><span>${(p.bytes/1024/1024).toFixed(1)} MB</span></div>`).join('')}</div>`:empty('Inbox, all clear.','New PDFs will appear here when you drop them into inbox/.',false);$('pagination').hidden=true;return;}
 const active=state.q||state.category||state.type||state.year||state.status;$('results-note').innerHTML=`${fmt(rows.length)} ${rows.length===1?'page':'pages'}${state.q?` matching “${esc(state.q)}”`:''}${active?'<button class="plain clear-filters" id="reset">Clear filters</button>':''}`;
 if(searchState.loading){$('results').innerHTML=empty('Searching the library…','',false);$('pagination').hidden=true;return;}
 if(searchState.error){$('results').innerHTML=empty('Check your search.',esc(searchState.error));$('pagination').hidden=true;return;}
 if(searchState.fallback)$('results-note').innerHTML+=' · Live search unavailable; searching loaded pages';
 if(!shown.length){$('results').innerHTML=empty(state.view==='saved'&&!active?'A little space for your next read.':'No matching pages.',state.view==='saved'&&!active?'Use the bookmark beside a document to keep it here.':'Try a different term, category, or year.',Boolean(active));}
 else if(state.view==='attention')$('results').innerHTML=`<div class="attention-list">${shown.map(p=>`<div class="attention-item"><div>${titleBlock(p)}<div class="flags">${p.flags.map(f=>`<span class="pill">${esc(f)}</span>`).join('')}</div></div>${pill(p)}</div>`).join('')}</div>`;
 else $('results').innerHTML=state.layout==='cards'?cards(shown):table(shown);

}
function rail(){const entries=Object.entries(DATA.meta.categories).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...entries.map(x=>x[1]));const pending=DATA.pages.filter(p=>p.type==='proposal'&&p.status==='proposed').sort((a,b)=>(Date.parse(b.added)||0)-(Date.parse(a.added)||0));$('rail').innerHTML=`<section class="panel"><div class="panel-head"><h2>Across the library</h2>${icon('map')}</div><div class="rail-body">${entries.map(([cat,n])=>`<button class="category-row" data-category="${esc(cat)}"><span class="category-label"><span>${esc(label(cat))}</span><span class="muted">${fmt(n)}</span></span><div class="category-track"><div class="category-fill" style="width:${n/max*100}%"></div></div></button>`).join('')}<p class="rail-note">Paper and commentary pages, grouped by their home category.</p></div></section><section class="panel"><div class="panel-head"><h2>On your radar</h2><span class="pill">${pending.length} to review</span></div><div class="rail-body">${pending.length?pending.slice(0,3).map(p=>`<button class="queue-item" data-page="${esc(p.id)}"><span>${esc(p.direction.replace(/_/g,' '))} · ${esc(p.proposed_page_type)}</span><strong>${esc(p.title)}</strong></button>`).join(''):'<p class="rail-note">No proposals awaiting a decision.</p>'}</div></section><section class="panel"><div class="panel-head"><h2>Inbox</h2><button class="plain text-link" data-view="inbox">${DATA.inbox.length} ${icon('arrow')}</button></div><div class="rail-body"><div class="inbox-clear">${icon(DATA.inbox.length?'inbox':'check')}<div>${DATA.inbox.length?`${DATA.inbox.length} PDF${DATA.inbox.length===1?'':'s'} ready`:'All papers accounted for.'}<p>${DATA.inbox.length?'Open the inbox to see the new drops.':'No PDFs waiting to be ingested.'}</p></div></div></div></section>`;}

function resolveWiki(target){const key=target.replace(/^wiki\//,'').replace(/\.md$/,'');if(byId.has(key))return key;const candidates=byStem.get(key)||[];return candidates.length===1?candidates[0]:null;}
function inline(text,claimMarker){const stash=[],put=s=>{const index=stash.push(s)-1;return `\u0000${index}\u0000`;};let raw=String(text).replace(/\u0000/g,'');

  });

 });
 protect(/\[([^\]]+)\]\(([^\s)]+)\)/g,(_,title,url)=>{let safe=false;try{safe=['https:','http:','mailto:'].includes(new URL(url).protocol);}catch(_){}return put(safe?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a>`:esc(title));});

 let out=esc(raw).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/~~([^~]+)~~/g,'<del>$1</del>');return out.replace(/\u0000(\d+)\u0000/g,(_,n)=>stash[Number(n)]);}
function cells(line){let out=[],cell='',wiki=false,code=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='`')code=!code;if(c==='['&&line[i+1]==='[')wiki=true;if(c===']'&&line[i+1]===']')wiki=false;if(c==='\\'&&line[i+1]==='|'){cell+='|';i++;continue;}if(c==='|'&&!wiki&&!code){out.push(cell.trim());cell='';}else cell+=c;}out.push(cell.trim());if(!out[0])out.shift();if(!out[out.length-1])out.pop();return out;}
function markdown(body,claimOffset){
 const anchor='<span id="reader-claim"></span>';

  // The parser counts Unicode code points. JS string offsets count UTF-16 units.
  const chars=Array.from(body);

 // Parse block syntax on the original lines. Add the target inside visible content.
 function content(index,prefixLength=0){
  const line=lines[index].slice(prefixLength);

 const out=[],toc=[],footnotes=[];
 const listPrefix=/^\s*([-*+]\s|\d+\.\s)/;
 const special=line=>/^\s*$|^#{1,6}\s|^\s*```|^\s*[-*+]\s|^\s*\d+\.\s|^\s*>|^\[\^[^\]]+\]:|^\|/.test(line);
 let i=0;
 while(i<lines.length){
  const line=lines[i];
  if(!line.trim()){i++;continue;}
  if(/^\s*```/.test(line)){
   const opening=i++,block=[];
   while(i<lines.length&&!/^\s*```/.test(lines[i]))block.push(content(i++));
   let code=esc(block.join('\n'));
   if(marker)code=code.replace(marker,anchor);
   if(claimLine===opening)code=anchor+code;
   if(claimLine===i)code+=anchor;
   out.push(`<pre><code>${code}</code></pre>`);
   i++;continue;
  }
  const head=line.match(/^(#{1,6})\s+(.+)$/);
  if(head){
   const id=`section-${toc.length}`,level=head[1].length;

  }

   while(i<lines.length&&/^\s*\|/.test(lines[i])){

   }
   out.push(`<div class="table-scroll"><table><thead><tr${headerId}>${headers.map(t=>`<th scope="col">${inline(t)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`);

  }

    let item=content(i++,prefix.length);
    while(i<lines.length&&lines[i].trim()&&!special(lines[i]))item+=' '+content(i++).trim();

   }
   out.push(`<${tag}>${items.join('')}</${tag}>`);continue;
  }
  if(/^\s*>/.test(line)){
   const quote=[];
   while(i<lines.length&&/^\s*>/.test(lines[i])){
    const prefix=lines[i].match(/^\s*>\s?/)[0];
    quote.push(content(i++,prefix.length));
   }
   out.push(`<blockquote>${inline(quote.join(' '),marker)}</blockquote>`);continue;
  }

   out.push(i===claimLine?'<hr id="reader-claim">':'<hr>');i++;continue;
  }

  while(i<lines.length&&lines[i].trim()&&!special(lines[i]))paragraph.push(content(i++));

}
function showPage(id,anchor='',push=true,preserveScroll=false){const scroll=preserveScroll?$('reader-scroll').scrollTop:push?null:history.state?.readerScroll;const p=byId.get(id);if(!p){toast('This page is no longer in the library.');return;}state.id=id;state.anchor=anchor;if(push)state.section='';writeHash(push);const md=markdown(p.body,p.claim_offsets?.[anchor]);$('reader-toc').innerHTML='<h3>In this page</h3>'+md.toc.filter(h=>h.level<=2).map(h=>`<button class="plain toc-link" data-section="${h.id}">${esc(h.title)}</button>`).join('');$('reader-actions').innerHTML=`${p.pdf_url?`<a class="small-btn primary" href="${esc(p.pdf_url)}" target="_blank" rel="noopener">${icon('file')} Source PDF</a>`:''}<a class="small-btn" href="${esc(p.obsidian_url)}">Obsidian ↗</a><a class="small-btn" href="${esc(p.markdown_url)}" target="_blank" rel="noopener">Markdown ↗</a>${bookmark(p)}<button class="small-btn" id="copy-link">${icon('link')} Copy link</button>`;$('reader-back').disabled=historyDepth===0;$('reader-content').innerHTML=`${pill(p)}<h1 class="reader-title" id="reader-title">${esc(p.title)}</h1><div class="reader-meta">${esc(p.authors)}${p.venue?'<br>'+esc(p.venue):''}${p.year?' · '+p.year:''}${p.doi?`<br>DOI: <a href="https://doi.org/${esc(encodeURI(p.doi))}" target="_blank" rel="noopener noreferrer">${esc(p.doi)}</a>`:''}<br>${p.added?`${p.date_field==='generated_at'?'Updated':p.date_field==='created_at'?'Created':'Added'} ${date(p.added)}`:'Added date not recorded'}${p.status?' · '+esc(p.status):''}${p.verdict?' · '+esc(p.verdict):''}</div><div class="reader-tags">${[...new Set([...p.keywords,...p.tags])].map(k=>`<button data-query="${esc(k)}">${esc(k)}</button>`).join('')}</div><article class="prose">${md.html}</article><div class="related"><h3>Linked from ${p.backlinks.length} ${p.backlinks.length===1?'page':'pages'}</h3>${p.backlinks.map(k=>`<button class="plain" data-page="${esc(k)}">${esc(byId.get(k)?.short_name||byId.get(k)?.title||k)}</button>`).join('')}</div>
